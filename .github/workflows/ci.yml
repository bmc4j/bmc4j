name: CI

# Runs on pushes to main (gate across the supported-JDK axis 17/21/25 + every
# platform smoke), on pull requests (trimmed for fast feedback: one JDK-21 gate +
# one linux-arm64 smoke), and on manual dispatch (fully scriptable via the
# inputs). The release workflow calls it too.
#
# The root test is the green gate: the model-conformance proof suite plus every
# example module — the fail-on-purpose demos declare their expected verdicts
# (expect = REFUTED / VACUOUS / TIMEOUT), so the whole run is green by design.
# Every other platform gets a smoke job: one real proof class end-to-end, which
# exercises that platform's engine jar assembly -> extraction -> an actual jbmc
# run. A docs link-check job guards the README/docs/examples cross-links.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Run the full gate job (linux-x64)'
        type: boolean
        default: true
      platforms:
        description: 'Smoke platforms: "all", "none", or comma-separated from windows-x64,linux-arm64,macos-x64,macos-arm64'
        default: all
      jdks:
        description: 'Comma-separated JDKs for the gate matrix (e.g. "17,21,25")'
        default: '21'
  # Callable from the release workflow (full gate + smokes before publishing).
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: true
      platforms:
        type: string
        default: all
      jdks:
        type: string
        default: '21'

permissions:
  contents: read

# Force-pushes to a PR cancel its superseded runs; main pushes and dispatches
# never cancel mid-run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # matrix context isn't available in a job-level `if`, so the smoke-platform
  # filter, the gate switch, and the gate JDK list are computed here and fed via
  # fromJSON (same pattern as engine-jars.yml). Per-event defaults:
  #   push (main)   -> gate + ALL smokes
  #   pull_request  -> gate + linux-arm64 smoke only (fast feedback)
  #   dispatch/call -> whatever the inputs say
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
      any: ${{ steps.filter.outputs.any }}
      gate: ${{ steps.filter.outputs.gate }}
      jdks: ${{ steps.filter.outputs.jdks }}
    steps:
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          JDKS: ${{ inputs.jdks }}
          GATE_INPUT: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          all='[
            {"runner":"windows-latest","platform":"windows-x64"},
            {"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},
            {"runner":"macos-15-intel","platform":"macos-x64"},
            {"runner":"macos-14","platform":"macos-arm64"}
          ]'

          # Per-event defaults; inputs.* are empty on push/PR events. Every merge to main
          # validates the whole supported-JDK axis: full suite on 21 and 25, core + model
          # conformance on 17 (the shipped-floor runtime; examples need newer javac). PRs
          # stay single-JDK for fast feedback.
          case "$EVENT" in
            push)         gate="true"; sel_spec="all"; jdk_spec="17,21,25" ;;
            pull_request) gate="true"; sel_spec="linux-arm64"; jdk_spec="21" ;;
            *)            gate="${GATE_INPUT:-true}"; sel_spec="${PLATFORMS:-all}"; jdk_spec="${JDKS:-21}" ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

          jdks="$(echo "$jdk_spec" | jq -cR 'split(",") | map(gsub("\\s";"")) | map(select(length > 0))')"
          echo "jdks=$jdks" >> "$GITHUB_OUTPUT"

          if [ "$sel_spec" = "all" ]; then
            sel="$(echo "$all" | jq -c .)"
          elif [ "$sel_spec" = "none" ]; then
            sel='[]'
          else
            sel="$(echo "$all" | jq -c --arg p "$sel_spec" \
              '[ .[] | select(.platform as $x | ($p | split(",") | map(gsub("\\s";"")) | index($x)) != null) ]')"
            [ "$sel" != "[]" ] || { echo "No platforms matched '$sel_spec'"; exit 1; }
          fi
          echo "Event: $EVENT | gate: $gate (JDKs $jdks) | smoke: $(echo "$sel" | jq -r 'if length == 0 then "(none)" else [.[].platform] | join(", ") end')"
          echo "include=$sel" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$sel" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  gate:
    name: full gate (linux-x64, JDK ${{ matrix.jdk }})
    needs: plan
    if: ${{ needs.plan.outputs.gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        jdk: ${{ fromJSON(needs.plan.outputs.jdks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Persist bmc4j verdict caches across runs. Safe by the cache's own design:
      # entries are keyed on analysis-classpath CONTENT + request + engine identity +
      # runtime semantics version, and only expectation-matching deterministic PASSES
      # are ever served (VERIFIED, or REFUTED/VACUOUS for a demo expecting exactly
      # that; failures and TIMEOUT/UNKNOWN always re-run) — a restored stale dir
      # cannot produce a stale pass, it just skips re-proving what hasn't changed.
      # Key on run_id so every run saves a fresh snapshot; restore-keys picks up the
      # most recent prior one.
      - name: Restore verdict caches
        uses: actions/cache@v5
        with:
          path: '**/build/bmc4j/verdict-cache'
          key: bmc-verdict-${{ runner.os }}-jdk${{ matrix.jdk }}-${{ github.run_id }}
          restore-keys: |
            bmc-verdict-${{ runner.os }}-jdk${{ matrix.jdk }}-

      - name: Core - build + unit tests
        run: ./gradlew -p core build --no-daemon

      # The root test runs EVERYTHING: the model-conformance proof suite plus every
      # example module. The fail-on-purpose demos all declare their expected verdict
      # (expect = REFUTED / VACUOUS / TIMEOUT), so they pass while the guard they
      # protect holds and go loudly red on a drift — the root test is GREEN by design.
      # -Dbmc.timeoutSeconds=180 keeps any SAT-pathological proof failing fast as a
      # NAMED UNKNOWN instead of hanging the job (per-proof budgets like the timeout
      # demo's 1s override it). The examples need newer javac than 17 (language
      # features), so JDK 17 runs core + conformance only; EVERY OTHER matrix JDK
      # runs the full root test — a matrix dispatch like "17,21,25" therefore
      # validates the rewrite layer's unit tests on each host JDK and the full
      # example suite (where e.g. the pattern-switch desugars live) on 21 AND 25.
      # jarModelsConformanceTest is invoked EXPLICITLY: root `test` doesn't trigger
      # `check`, so without it the as-shipped JAR rewrite path (ClasspathMirror on
      # jars - what a published consumer actually exercises) would have no CI coverage.
      - name: Root test - conformance proofs + all examples (expected-verdict demos included)
        if: ${{ matrix.jdk != '17' }}
        run: ./gradlew test :model-conformance-proofs:jarModelsConformanceTest --no-daemon -Dbmc.timeoutSeconds=180

      - name: Model conformance proofs (JDK 17 - examples need newer javac)
        if: ${{ matrix.jdk == '17' }}
        run: ./gradlew :model-conformance-proofs:test --no-daemon -Dbmc.timeoutSeconds=180

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-jdk${{ matrix.jdk }}-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  smoke:
    name: smoke ${{ matrix.platform }}
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # One real proof class, end-to-end: assembles this platform's engine jar from
      # the (checksum-verified) upstream artifact, extracts the bundled jbmc, and
      # verifies actual proofs with it. bash on windows runs the sh wrapper fine.
      - name: One proof class end-to-end
        shell: bash
        run: ./gradlew :model-conformance-proofs:test --tests "proofs.optional.*" --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.platform }}-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Docs link check: the README/docs/examples cross-link web has broken before.
  # Offline mode = internal file links + anchors only (no network flakiness).
  # Cheap (seconds, 1x linux).
  links:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check internal doc links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress README.md CONTRIBUTING.md SECURITY.md THIRD-PARTY-NOTICES.md "docs/**/*.md" "examples/**/*.md"
          fail: true
