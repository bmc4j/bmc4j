name: CI

# One uniform shape: a `build` job (core build + unit tests, once, canonical JDK) and a
# `proofs` job - a single leg-matrix where every leg is "run this proof scope at JVM N
# (optionally with consumer-kotlinc V)". Host JDK == toolchain == bytecode target per
# leg (-PbmcJvmTarget), so a leg named jdk17 genuinely runs the shipped-floor runtime
# AND feeds 17-bytecode to the engine - no toolchain theater.
#
# Per-event legs (computed in `plan`):
#   push (main)   -> jdk17-floor (conformance), jdk21 + jdk25 (full suite),
#                    consumer-kotlin 2.0 + 2.2 + 2.3 (conformance + Kotlin examples,
#                    JVM 21), ALL platform smokes
#   pull_request  -> jdk21 full + consumer-kotlin 2.4 + one linux-arm64 smoke (fast feedback)
#   dispatch/call -> from the jdks/kotlins/platforms inputs
#
# The proof suites are green by design: the fail-on-purpose demos declare their
# expected verdicts (expect = REFUTED / VACUOUS / TIMEOUT / UNKNOWN). Every other
# platform gets a smoke job: one real proof class end-to-end, exercising that
# platform's engine jar assembly -> extraction -> an actual jbmc run. A docs
# link-check job guards the README/docs/examples cross-links.

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue: GitHub runs CI against each queued PR rebased on the latest main
  # BEFORE it lands, so a red leg (or a cross-PR break) can never reach main. The
  # merge_group leg runs the SAME full matrix as a push to main (below).
  merge_group:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Run the build + proof legs (false = smokes/links only)'
        type: boolean
        default: true
      platforms:
        description: 'Smoke platforms: "all", "none", or comma-separated from windows-x64,linux-arm64,linux-x64-musl,macos-x64,macos-arm64'
        default: all
      jdks:
        description: 'Comma-separated JDK proof legs (e.g. "17,21,25"; 17 runs conformance-only - examples need newer javac)'
        default: '21'
      kotlins:
        description: 'Comma-separated consumer-kotlinc proof legs (e.g. "2.0.21,2.2.21"; empty = none)'
        default: ''
      shards:
        description: 'Shards per slow proof leg (runners to fan each leg across; 1 = unsharded)'
        default: '3'
      snapshot:
        description: 'Run the snapshot-publish + consumer-test legs (the push-to-main flow) for testing this branch'
        type: boolean
        default: false
  # Callable from the release workflow (full verification before publishing).
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: true
      # Skip the proof legs while keeping the build + unit tests + platform smokes (the release
      # uses this for now: publish on a green build + smoke, without waiting on the full proof
      # matrix). Only honoured from a workflow_call caller; empty on a real push/PR event.
      proofs:
        type: boolean
        default: true
      platforms:
        type: string
        default: all
      jdks:
        type: string
        default: '21'
      kotlins:
        type: string
        default: ''
      shards:
        type: string
        default: '3'

permissions:
  contents: read

# Force-pushes to a PR cancel its superseded runs; main pushes and dispatches
# never cancel mid-run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # matrix context isn't available in a job-level `if`, so the proof legs and the
  # smoke-platform filter are computed here and fed via fromJSON (same pattern as
  # engine-jars.yml). Every leg is one uniform shape: {name, jdk, kotlin, flags, tasks}.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
      any: ${{ steps.filter.outputs.any }}
      alpine: ${{ steps.filter.outputs.alpine }}
      gate: ${{ steps.filter.outputs.gate }}
      legs: ${{ steps.filter.outputs.legs }}
      legNames: ${{ steps.filter.outputs.legNames }}
    steps:
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          JDKS: ${{ inputs.jdks }}
          KOTLINS: ${{ inputs.kotlins }}
          GATE_INPUT: ${{ inputs.gate }}
          PROOFS_INPUT: ${{ inputs.proofs }}
          SHARDS_INPUT: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          # How many runners to fan each slow proof leg across (1 = unsharded). Default 3:
          # ~2.3x faster than a single leg, past which fixed runner setup floors the gain.
          SHARDS="${SHARDS_INPUT:-3}"
          [ -n "$SHARDS" ] || SHARDS=3
          all='[
            {"runner":"windows-latest","platform":"windows-x64"},
            {"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},
            {"runner":"macos-15-intel","platform":"macos-x64"},
            {"runner":"macos-14","platform":"macos-arm64"}
          ]'

          # Proof scopes -> Gradle tasks. "conformance" is the model suite alone (the
          # JDK-17 floor leg: examples need newer javac); "full" is everything incl.
          # jarModelsConformanceTest (root `test` doesn't trigger `check`, and the
          # as-shipped JAR rewrite path needs explicit coverage); "kotlin" is the
          # conformance suite + every Kotlin-facing example.
          conformance=":model-conformance-proofs:test"
          full="test :model-conformance-proofs:jarModelsConformanceTest"
          kotlin=":model-conformance-proofs:test :examples:fundamentals-kotlin:test :examples:language-kotlin:test :examples:kotlin-coroutines-and-lincheck:test :examples:contracts-kotlin:test :examples:integrations:test"

          # jdk_leg <jdk> / kotlin_leg <version>: one uniform leg each. Host JDK ==
          # toolchain == bytecode target (-PbmcJvmTarget), so the leg's name is the
          # truth. Consumer-kotlin legs run at JVM 21 (older KGPs have no JVM-25
          # target, and real older-Kotlin consumers run older JVMs).
          # SHARDS: split a leg's proof suite across N runners. Proofs are embarrassingly
          # parallel (each spawns its own engine process; per-proof process cost dominates), so
          # more runners shrink a leg's wall-clock near-linearly. A ServiceLoader PostDiscoveryFilter
          # in bmc-runtime keeps 1/N of the suite per shard, balanced at the METHOD level by a hash of
          # each test's unique id (so a 55-proof class and a 1-proof class split evenly). The
          # per-proof verdict cache makes the slices' results mergeable: each entry is keyed by
          # content, so the union of the shards' caches is sound by construction (a merge job below
          # unions them into a shared snapshot every shard restores next run). 1 shard = unsharded.
          # The hash balances by COUNT, not COST: annotate a known-slow proof (or class) @org.bmc4j.Shard(N)
          # to pin it to shard N so the expensive proofs spread one-per-shard instead of hash-clustering
          # (out-of-range N folds back into range; never a silent skip). See ShardFilter / @Shard.
          legs='[]'
          # jdk_leg <jdk> [shards]: emits one matrix entry per shard. base/name is the leg; each
          # entry carries shardIndex/shardCount, and the proofs job adds -Dbmc.shard.* from them.
          jdk_leg() {
            local jdk="$1" shards="${2:-1}" scope tasks base i
            if [ "$jdk" = "17" ]; then scope="conformance"; tasks="$conformance"; else scope="full"; tasks="$full"; fi
            base="jdk${jdk}-${scope}"
            for i in $(seq 1 "$shards"); do
              legs="$(echo "$legs" | jq -c \
                --arg b "$base" --arg j "$jdk" --arg t "$tasks" \
                --argjson si "$i" --argjson sc "$shards" \
                '. + [{
                  name: (if $sc > 1 then ($b + " (shard " + ($si|tostring) + "/" + ($sc|tostring) + ")") else $b end),
                  leg: $b, jdk: $j, flags: ("-PbmcJvmTarget=" + $j), tasks: $t,
                  shardIndex: $si, shardCount: $sc
                }]')"
            done
          }
          # kotlin_leg <version> [shards]: one matrix entry per shard, mirroring jdk_leg. The
          # conformance suite (:model-conformance-proofs:test) is the dominant cost and shards by
          # proof-method via the bmc-runtime PostDiscoveryFilter exactly like the jdk legs; the
          # Kotlin example modules don't shard (no @BmcProof discovery to split) and simply re-run
          # on each shard - cheap relative to the conformance fan-out's wall-clock win. The
          # per-proof verdict cache + the merge job's union make the slices mergeable identically
          # to the jdk legs (one merged snapshot per leg, restored by every shard next run).
          kotlin_leg() {
            local v="$1" shards="${2:-1}" t base i
            t="$kotlin"
            # language-kotlin24 holds the 2.4-only syntax (context parameters, collection
            # literals) - older consumer compilers cannot build it, so only 2.4+ legs get it.
            case "$v" in 2.[4-9]*|2.[1-9][0-9]*|[3-9].*) t="$t :examples:language-kotlin24:test";; esac
            base="kotlin-${v}"
            for i in $(seq 1 "$shards"); do
              legs="$(echo "$legs" | jq -c \
                --arg b "$base" --arg v "$v" --arg t "$t" \
                --argjson si "$i" --argjson sc "$shards" \
                '. + [{
                  name: (if $sc > 1 then ($b + " (shard " + ($si|tostring) + "/" + ($sc|tostring) + ")") else $b end),
                  leg: $b, jdk: "21", flags: ("-PbmcJvmTarget=21 -PbmcKotlinVersion=" + $v), tasks: $t,
                  shardIndex: $si, shardCount: $sc
                }]')"
            done
          }

          # Per-event defaults; inputs.* are empty on push/PR events.
          case "$EVENT" in
            push|merge_group)
              gate="true"; sel_spec="all"
              # 17 is conformance-only and already fast (~1.5 min); the full 21/25 legs are the
              # slow ones, so fan those out across SHARDS while 17 stays single.
              jdk_leg 17; jdk_leg 21 "$SHARDS"; jdk_leg 25 "$SHARDS"
              # 2.4 is also the default toolchain the full legs compile with, but it gets
              # its own EXPLICIT leg so the kotlin axis is self-contained - implicit
              # coverage would silently vanish the day the default bumps to 2.5.
              # Every kotlin leg ran ~10 min single-shard (the slowest jobs in the run, slower
              # than the now-sharded jdk-full legs), so fan them all out across SHARDS too.
              kotlin_leg 2.0.21 "$SHARDS"; kotlin_leg 2.2.21 "$SHARDS"; kotlin_leg 2.3.21 "$SHARDS"; kotlin_leg 2.4.0 "$SHARDS"
              ;;
            pull_request)
              gate="true"; sel_spec="linux-arm64"
              # The PR critical path is this one full leg, so shard it for fast feedback.
              jdk_leg 21 "$SHARDS"
              # Kotlin-first: PRs also prove the Kotlin examples/conformance on the
              # newest consumer compiler (the full version matrix stays on main pushes).
              # 2.4 is now the slowest PR job, so shard it for fast feedback like the jdk21 leg.
              kotlin_leg 2.4.0 "$SHARDS"
              ;;
            *)
              gate="${GATE_INPUT:-true}"; sel_spec="${PLATFORMS:-all}"
              for j in $(echo "${JDKS:-21}" | tr ',' ' '); do jdk_leg "$j" "$SHARDS"; done
              for k in $(echo "${KOTLINS:-}" | tr ',' ' '); do [ -n "$k" ] && kotlin_leg "$k" "$SHARDS"; done
              ;;
          esac
          # A workflow_call caller can skip the proof legs (the release does, for now) while keeping
          # gate=true so the build + unit tests still run. Dropping legs to [] is enough: the proofs,
          # merge-verdict-cache, and proof-comment jobs all gate on legs != '[]'. PROOFS_INPUT is
          # 'false' ONLY when a caller passes it; it's empty on a real push/PR event (inputs don't
          # apply), so this never affects normal CI.
          if [ "${PROOFS_INPUT:-}" = "false" ]; then
            echo "Proofs skipped (caller passed proofs=false): build + smokes only."
            legs='[]'
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          # Distinct leg names (one merged verdict-cache snapshot per leg, regardless of shard count).
          legNames="$(echo "$legs" | jq -c '[.[].leg] | unique')"
          echo "legNames=$legNames" >> "$GITHUB_OUTPUT"

          # linux-x64-musl smokes in an alpine CONTAINER (it needs a musl toolchain to
          # assemble + run its engine), so it's tracked by a separate `alpine` flag, not
          # in the runner-native smoke matrix `all`.
          if [ "$sel_spec" = "all" ]; then
            sel="$(echo "$all" | jq -c .)"
            alpine="true"
          elif [ "$sel_spec" = "none" ]; then
            sel='[]'
            alpine="false"
          else
            sel="$(echo "$all" | jq -c --arg p "$sel_spec" \
              '[ .[] | select(.platform as $x | ($p | split(",") | map(gsub("\\s";"")) | index($x)) != null) ]')"
            if echo "$sel_spec" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -qx 'linux-x64-musl'; then
              alpine="true"
            else
              alpine="false"
            fi
            if [ "$sel" = "[]" ] && [ "$alpine" != "true" ]; then
              echo "No platforms matched '$sel_spec'"; exit 1
            fi
          fi
          echo "Event: $EVENT | gate: $gate | legs: $(echo "$legs" | jq -r '[.[].name] | join(", ")') | smoke: $(echo "$sel" | jq -r 'if length == 0 then "(none)" else [.[].platform] | join(", ") end')$([ "$alpine" = "true" ] && echo ", linux-x64-musl")"
          echo "include=$sel" >> "$GITHUB_OUTPUT"
          echo "alpine=$alpine" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$sel" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  # Core build + unit tests: once, on the canonical JDK. The proof legs validate the
  # runtime ON each JVM (their test processes actually run bmc-runtime at the leg's
  # JVM); this job validates that the product BUILDS clean (compile, unit tests,
  # javadoc/jar plumbing).
  build:
    name: build + unit tests
    needs: plan
    if: ${{ needs.plan.outputs.gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Cache the EXTRACTED engine so prepareEngine no-ops on a hit (its existence
      # check sees build/engine/jbmc/<platform>/{bin/jbmc,lib/core-models.jar} and
      # skips the GitHub-release-CDN download entirely - that download is the source
      # of the recurring transient 504s). This runner is linux-x64, so only that
      # module's engine assembles here. Key captures arch/os + cbmc version + a hash
      # of every engine build.gradle.kts, so a version bump or download-logic change
      # invalidates the cache and re-downloads (still SHA-256-verified on the miss).
      - name: Cache engine (linux-x64)
        uses: actions/cache@v4
        with:
          path: |
            core/bmc-engine-linux-x64/build/engine
            core/bmc-engine-linux-x64/build/download
          key: bmc-engine-linux-x64-cbmc6.9.0-${{ hashFiles('core/bmc-engine-*/build.gradle.kts') }}
          restore-keys: |
            bmc-engine-linux-x64-cbmc6.9.0-

      - name: Core - build + unit tests
        run: ./gradlew -p core build --no-daemon

  # ONE uniform proof job: every leg is "run these proof tasks at this JVM with these
  # flags". -Dbmc.timeoutSeconds=300 keeps any SAT-pathological proof failing fast as
  # a NAMED UNKNOWN instead of hanging the job (per-proof budgets override it).
  proofs:
    name: proofs ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.gate == 'true' && needs.plan.outputs.legs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Cache the EXTRACTED engine so prepareEngine no-ops on a hit (skips the
      # GitHub-release-CDN download that flakes with transient 504s). Proof legs run
      # on ubuntu-latest = linux-x64, so only that engine assembles. Key captures
      # arch/os + cbmc version + a hash of every engine build.gradle.kts; a version
      # bump or download-logic change invalidates it and re-downloads (SHA-256-verified).
      - name: Cache engine (linux-x64)
        uses: actions/cache@v4
        with:
          path: |
            core/bmc-engine-linux-x64/build/engine
            core/bmc-engine-linux-x64/build/download
          key: bmc-engine-linux-x64-cbmc6.9.0-${{ hashFiles('core/bmc-engine-*/build.gradle.kts') }}
          restore-keys: |
            bmc-engine-linux-x64-cbmc6.9.0-

      # Restore the per-LEG verdict cache (one lineage per leg, shared by all its shards):
      # different JVM targets / kotlinc versions emit different bytecode -> different content
      # keys, so the cache key scopes WHICH snapshot is restored; the cache's own content-keying
      # handles correctness. Every shard restores the SAME leg snapshot - the UNION the prior
      # run's merge job saved - so each shard starts from every shard's proven proofs and only
      # re-solves its own slice + whatever changed. restore-only (no save here): the merge job
      # below produces the next snapshot from the shard artifacts.
      - name: Restore verdict caches
        uses: actions/cache/restore@v5
        with:
          path: |
            **/build/bmc4j/verdict-cache
            **/build/bmc4j/unwind-cache
          key: bmc-verdict-${{ runner.os }}-${{ matrix.leg }}-merged-${{ github.run_id }}
          restore-keys: |
            bmc-verdict-${{ runner.os }}-${{ matrix.leg }}-merged-
            bmc-verdict-${{ runner.os }}-${{ matrix.leg }}-

      # --no-build-cache: Gradle's task cache would REPLAY test results for legs whose
      # inputs match another leg (it formally deduped the kotlin-2.3-default leg against
      # jdk21-full on its first run) - but these legs exist to PROVE each version
      # combination actually works, so the test JVMs must execute. Speed still comes
      # from the right layer: the per-proof verdict cache (restored above) skips the
      # SOLVES for anything unchanged, which also keeps that cache continuously
      # exercised in CI. Dependency caching (setup-gradle) is unaffected.
      #
      # -Dbmc.shard.* select this shard's slice of the suite (the bmc-runtime
      # PostDiscoveryFilter keeps 1/N of the proofs); shardCount=1 is a no-op (full suite).
      # -Dbmc.summaryDir: every proof test JVM appends one JSONL record (verdict, cached vs live,
      # elapsed, pass/fail, truncated counterexample) under this dir. The bmc-runtime sink + the
      # plugin's forwardCli pass it through to the forked workers. The pr-proof-comment job unions
      # every shard's records into the PR results table. Emission is fail-open (never perturbs a
      # verdict), so it's always on - harmless on push/dispatch where no comment job consumes it.
      - name: Proofs (${{ matrix.tasks }})
        shell: bash
        run: |
          ./gradlew --no-daemon --no-build-cache --stacktrace -Dbmc.timeoutSeconds=300 \
            -Dbmc.shard.count=${{ matrix.shardCount }} -Dbmc.shard.index=${{ matrix.shardIndex }} \
            -Dbmc.summaryDir="$GITHUB_WORKSPACE/bmc-proof-summary" \
            ${{ matrix.flags }} ${{ matrix.tasks }}

      # always(): a shard that FAILED still proved (and thus recorded) every passing proof and the
      # failing one's counterexample - the comment job needs both. Tag each tarball with leg + shard
      # so the aggregator can detect a lost shard (a discovered proof whose record never arrived).
      - name: Pack proof summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE/bmc-proof-summary" ]; then
            tar -czf proof-summary-shard.tgz -C "$GITHUB_WORKSPACE" bmc-proof-summary
          else
            tar -czf proof-summary-shard.tgz --files-from /dev/null
          fi

      - name: Upload proof summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-summary-${{ matrix.leg }}-${{ matrix.shardIndex }}-of-${{ matrix.shardCount }}
          path: proof-summary-shard.tgz
          if-no-files-found: ignore

      # always(): upload this shard's verdict-cache tree even when the leg FAILS - the cache
      # only ever stores expectation-matching verdicts (a flaky/failed/timed-out proof is never
      # written), so a red shard's cache holds exactly the proofs that did pass. The merge job
      # unions all shards' trees into the next leg snapshot, so a re-run continues from there.
      # One artifact per shard (per leg), tar-preserving the relative module paths so the merge
      # can splice them back. Sanitize the leg name for the artifact name (no "/", spaces).
      - name: Pack verdict cache for merge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # tar every '<module>/build/bmc4j/{verdict,unwind}-cache' dir (workspace-relative, so it
          # extracts back to the same layout). The unwind cache (the AUTO-discovered loop bound per
          # proof) is a sibling of the verdict cache and must persist too, or every run re-climbs from
          # scratch. Always produce a (possibly empty) tarball so upload never no-ops away the artifact.
          find . -type d \( -path '*/build/bmc4j/verdict-cache' -o -path '*/build/bmc4j/unwind-cache' \) -print0 > dirs.0 || true
          if [ -s dirs.0 ]; then
            tar --null -czf verdict-cache-shard.tgz -T dirs.0
          else
            tar -czf verdict-cache-shard.tgz --files-from /dev/null
          fi
          rm -f dirs.0

      - name: Upload verdict cache shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verdict-cache-${{ matrix.leg }}-${{ matrix.shardIndex }}-of-${{ matrix.shardCount }}
          path: verdict-cache-shard.tgz
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proofs-${{ matrix.shardIndex }}-of-${{ matrix.shardCount }}-${{ matrix.leg }}-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Union each leg's shard verdict-caches into one snapshot, saved under the leg's
  # `-merged-<run_id>` key that every shard restores next run. One matrix entry per leg, so a
  # static actions/cache/save step (stock actions only) handles exactly one leg's snapshot.
  #
  # The union is sound by construction: every cache entry is a file named by a content digest of
  # its full inputs, so two shards' caches are disjoint sets of files and identically-named files
  # are byte-identical (same inputs -> same verdict). `cp -n` (no-clobber) is therefore a safe set
  # union - it never overwrites, so it can never replace a verdict, only add missing ones. The
  # merge is OPAQUE file-copy: it treats keys as filenames and never parses them, so it works
  # unchanged whether the key is the coarse whole-classpath digest or a per-proof reachable-cone
  # digest. always() + a red shard still contributed its passing proofs (only passes are ever in
  # the cache), so merging after a failure stays sound.
  #
  # The shards uploaded their verdict-cache trees as tgz preserving the module-relative paths
  # (`<module>/build/bmc4j/verdict-cache/<key>`); extracting them at the workspace root recreates
  # exactly the layout the proofs job's restore (`path: '**/build/bmc4j/verdict-cache'`) expects.
  merge-verdict-cache:
    name: merge verdict caches (${{ matrix.leg }})
    needs: [plan, proofs]
    if: ${{ always() && needs.plan.outputs.gate == 'true' && needs.plan.outputs.legs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legNames) }}
    steps:
      - name: Download this leg's shard caches
        uses: actions/download-artifact@v6
        with:
          path: shard-artifacts
          pattern: verdict-cache-${{ matrix.leg }}-*
          merge-multiple: false

      - name: Union shards into the workspace tree
        id: union
        shell: bash
        run: |
          set -euo pipefail
          # Find every shard tarball REGARDLESS of how download-artifact laid it out. This is
          # load-bearing: download-artifact@v6 nests each artifact under its own subdir ONLY when
          # it downloads MORE THAN ONE - a SINGLE artifact (every unsharded leg: jdk17-conformance,
          # kotlin-2.0/2.2/2.3/2.4) is extracted FLAT, straight into `shard-artifacts/`. The old
          # loop globbed `shard-artifacts/verdict-cache-*/` and required a directory, so single-
          # artifact legs found nothing, unioned 0 entries, skipped the save, and ran cold forever
          # (the #104 regression). Locating `verdict-cache-shard.tgz` by `find` handles both layouts.
          mapfile -t tgzs < <(find shard-artifacts -type f -name 'verdict-cache-shard.tgz' 2>/dev/null || true)
          # How many shard artifacts actually came down (each holds exactly one tarball), so we can
          # tell "no artifacts at all" (legitimate: a leg whose proofs all failed pre-cache) apart
          # from "artifacts present but yielded nothing" (a real regression - fail loud below).
          arts="$(find shard-artifacts -mindepth 1 -maxdepth 1 2>/dev/null | wc -l | tr -d ' ')"
          found=0
          for tgz in "${tgzs[@]}"; do
            [ -f "$tgz" ] || continue
            tmp="$(mktemp -d)"
            tar -xzf "$tgz" -C "$tmp" || true
            # No-clobber copy: each '<module>/build/bmc4j/verdict-cache/<key>' file lands at the
            # same workspace-relative path, unioning the shards without ever overwriting an entry.
            if cp -rn "$tmp/." "$GITHUB_WORKSPACE/" 2>/dev/null; then found=1; fi
            rm -rf "$tmp"
          done
          entries="$(find "$GITHUB_WORKSPACE" -type f \( -path '*/build/bmc4j/verdict-cache/*' -o -path '*/build/bmc4j/unwind-cache/*' \) 2>/dev/null | wc -l | tr -d ' ')"
          echo "leg '${{ matrix.leg }}': downloaded $arts shard artifact(s), ${#tgzs[@]} tarball(s); unioned $entries verdict-cache entries (found=$found)"
          # Loud guard so this can't silently regress again: if shard artifacts were present but
          # produced ZERO verdict entries, the union is broken (e.g. another layout change) - the
          # save would no-op and the leg would run cold. Fail the merge so it's visible, not silent.
          if [ "$arts" != "0" ] && [ "$entries" = "0" ]; then
            echo "::error::leg '${{ matrix.leg }}': $arts shard artifact(s) downloaded but unioned 0 verdict-cache entries - the merge union is broken (check the download-artifact layout / tarball paths). Refusing to save an empty snapshot."
            exit 1
          fi
          # Only save when there's something to save (an empty save would clobber the lineage).
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

      - name: Save merged snapshot
        if: ${{ steps.union.outputs.entries != '0' }}
        uses: actions/cache/save@v5
        with:
          path: |
            **/build/bmc4j/verdict-cache
            **/build/bmc4j/unwind-cache
          key: bmc-verdict-${{ runner.os }}-${{ matrix.leg }}-merged-${{ github.run_id }}

  # ── Proof-results report (PR comment on pull_request, job summary otherwise) ────
  #
  # After every proof leg finishes, union all shards' machine-readable per-proof summaries (the
  # -Dbmc.summaryDir JSONL each test JVM wrote, uploaded as proof-summary-* artifacts) into ONE
  # results table - proofs ran / expected / checked, cache hits vs live solves, and a per-failure row
  # naming the proof + its kind + truncated counterexample, plus the flake-fingerprint tally.
  #
  # On a pull_request the table is posted as a PR comment (a marker comment UPDATED in place on
  # subsequent pushes, never spammed). On any non-PR gated run (a main push, a workflow_dispatch, or
  # the release workflow_call) there's no PR to comment on, so the SAME table is written to the
  # workflow run's job-summary page (GITHUB_STEP_SUMMARY) instead - reusing the script's existing
  # summary-page rendering (the no-PR-number branch), identical format.
  #
  # always(): a red proof leg still uploaded its passing proofs AND the failure's counterexample, so
  # the report must still produce (the failure rows are the point). The data source is the structured
  # summary, not log-scraping - robust by construction.
  #
  # pull-requests: write is needed only by the PR-comment path; the non-PR paths write to the
  # job-summary page (contents: read suffices) and never touch the comment API. The job itself
  # never fails the run - it's reporting, not a gate.
  pr-proof-comment:
    name: Proof results report
    needs: [plan, proofs]
    # pull_request -> PR comment; merge_group (queue) / push to main / dispatch / release call ->
    # job-summary page. merge_group MUST be here or a failing queue run reports no readable table.
    # (PR runs from a push to a non-main branch still come through as pull_request, not push.)
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.gate == 'true' && needs.plan.outputs.legs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Used only on the pull_request path (commenting on the PR). The main-push path writes the
      # job-summary page and ignores this scope.
      pull-requests: write
    steps:
      - name: Download proof summaries
        uses: actions/download-artifact@v6
        with:
          path: summary-artifacts
          pattern: proof-summary-*
          merge-multiple: false

      - name: Unpack summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p summaries
          # Each artifact is one shard's tarball; extract preserving the artifact dir name so the
          # aggregator can recover leg + shard id from the path (see legOfPath). Handle both the
          # nested (multi-artifact) and flat (single-artifact) download-artifact layouts.
          find summary-artifacts -type f -name 'proof-summary-shard.tgz' -print0 \
            | while IFS= read -r -d '' tgz; do
                # The artifact dir is the tarball's parent (or summary-artifacts/ when flat).
                dir="$(dirname "$tgz")"
                name="$(basename "$dir")"
                [ "$name" = "summary-artifacts" ] && name="proof-summary-proofs-1-of-1"
                dest="summaries/$name"
                mkdir -p "$dest"
                tar -xzf "$tgz" -C "$dest" || true
              done
          echo "Unpacked $(find summaries -name '*.jsonl' | wc -l) summary file(s)."

      - name: Report the proof results (PR comment or job summary)
        uses: bmc4j/github-actions/proof-report@v1
        with:
          summary-root: summaries
          # PR head sha on a pull_request; the pushed commit on a main push.
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  smoke:
    name: smoke ${{ matrix.platform }}
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Cache the EXTRACTED engine for THIS smoke platform so prepareEngine no-ops on
      # a hit and skips the release-CDN download (the transient-504 source). Each
      # matrix platform caches its own engine dir under its own arch/os-scoped key -
      # no cross-arch contamination. cbmc version + the engine build.gradle.kts hash
      # invalidate on a bump or download-logic change (re-download stays SHA-256-verified).
      - name: Cache engine (${{ matrix.platform }})
        uses: actions/cache@v4
        with:
          path: |
            core/bmc-engine-${{ matrix.platform }}/build/engine
            core/bmc-engine-${{ matrix.platform }}/build/download
          key: bmc-engine-${{ matrix.platform }}-cbmc6.9.0-${{ hashFiles('core/bmc-engine-*/build.gradle.kts') }}
          restore-keys: |
            bmc-engine-${{ matrix.platform }}-cbmc6.9.0-

      # One real proof class, end-to-end: assembles this platform's engine jar from
      # the (checksum-verified) upstream artifact, extracts the bundled jbmc, and
      # verifies actual proofs with it. bash on windows runs the sh wrapper fine.
      - name: One proof class end-to-end
        shell: bash
        run: ./gradlew :model-conformance-proofs:test --tests "proofs.optional.*" --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.platform }}-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # linux-x64-musl smoke: GitHub has no Alpine runner, so run on ubuntu inside an
  # alpine container. End-to-end on musl: assemble the musl engine jar (now a fast
  # fetch + SHA-256-verify + extract of the prebuilt static-musl binary from the
  # bmc4j/jbmc-musl-builds release - NO in-pipeline compile), extract the bundled
  # jbmc + core-models.jar, then run that jbmc on a real, freshly-compiled Java class
  # and assert it VERIFIES. This proves the whole musl path - static musl binary ->
  # extraction -> a real jbmc analysis - on the actual musl C library.
  #
  # The Gradle proof suite (model-conformance-proofs) isn't used here: it pins a Java 25
  # toolchain that Foojay would fetch as a glibc build, which can't run under musl. The
  # alpine JDK (21) compiles the smoke class and runs Gradle for the engine assembly; the
  # bundled musl jbmc does the proof.
  smoke-alpine:
    name: smoke linux-x64-musl
    needs: plan
    if: ${{ needs.plan.outputs.alpine == 'true' }}
    runs-on: ubuntu-latest
    container: alpine:3.20
    timeout-minutes: 15
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    steps:
      # Assembly is now fetch + tar-extract (no C++ compile), so only the JDK (Gradle
      # + javac), curl/tar (the fetch + extract), and bash are needed - no CBMC build
      # toolchain. libstdc++ is the static musl binary's only (statically satisfied)
      # C++ dep; keep it for safety. gcompat is not needed (the binary is musl-native).
      - name: Install toolchain (apk)
        run: |
          set -eu
          apk add --no-cache \
            openjdk21 curl bash tar libstdc++

      - name: Checkout
        uses: actions/checkout@v6

      # Cache the EXTRACTED musl engine so prepareEngine no-ops on a hit and skips the
      # release-asset download (bmc4j/jbmc-musl-builds, same transient-504 CDN). The
      # cache action runs on the host runner but the workspace-relative path is shared
      # with the alpine container, so the restored engine dir is visible to the gradle
      # assemble below. Own key (musl-specific), invalidated by the cbmc version + the
      # engine build.gradle.kts hash; re-download on a miss stays SHA-256-verified.
      - name: Cache engine (linux-x64-musl)
        uses: actions/cache@v4
        with:
          path: |
            core/bmc-engine-linux-x64-musl/build/engine
            core/bmc-engine-linux-x64-musl/build/download
          key: bmc-engine-linux-x64-musl-cbmc6.9.0-${{ hashFiles('core/bmc-engine-*/build.gradle.kts') }}
          restore-keys: |
            bmc-engine-linux-x64-musl-cbmc6.9.0-

      # Assemble the musl engine jar: fetch + verify + extract the prebuilt musl jbmc.
      # The plugin's musl detection would wire this same engine for a real consumer in
      # this container.
      - name: Assemble musl engine jar
        run: ./gradlew -p core :bmc-engine-linux-x64-musl:build --no-daemon

      - name: Run a real proof with the bundled musl jbmc
        run: |
          set -eu
          export PATH="$JAVA_HOME/bin:$PATH"
          libs="$(pwd)/core/bmc-engine-linux-x64-musl/build/libs"
          jarfile="$(cd "$libs" && ls bmc-engine-linux-x64-musl-*.jar | grep -vE -- '-(javadoc|sources)\.jar$' | head -n1)"
          work="$(mktemp -d)"
          # Extract the bundled engine (binary + the operational model jar) exactly as the
          # runtime would, then exercise it directly.
          (cd "$work" && jar xf "$libs/$jarfile")
          eng="$work/jbmc/linux-x64-musl"
          chmod +x "$eng/bin/jbmc"
          "$eng/bin/jbmc" --version | grep -q "6.9.0"

          # A tiny program with an assertion that holds for all inputs: jbmc must report
          # VERIFICATION SUCCESSFUL. This is a genuine end-to-end proof on musl.
          cat > "$work/Smoke.java" <<'EOF'
          public class Smoke {
            static int dbl(int x) { return x + x; }
            public static void main(String[] a) {
              int x = a.length;
              assert dbl(x) == 2 * x;
            }
          }
          EOF
          (cd "$work" && javac Smoke.java)
          out="$("$eng/bin/jbmc" Smoke --classpath "$work:$eng/lib/core-models.jar" \
                  --function Smoke.main 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "VERIFICATION SUCCESSFUL" \
            || { echo "::error::musl jbmc did not prove the smoke assertion"; exit 1; }

  # Docs link check: the README/docs/examples cross-link web has broken before.
  # Offline mode = internal file links + anchors only (no network flakiness).
  # Cheap (seconds, 1x linux).
  links:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check internal doc links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress README.md CONTRIBUTING.md SECURITY.md THIRD-PARTY-NOTICES.md "docs/**/*.md" "examples/**/*.md"
          fail: true

  # ── Merge-queue gate ──────────────────────────────────────────────────────────
  # A single STABLE check the main ruleset's merge queue requires: green iff every
  # gating job (build, proofs, the verdict-cache merge, smokes, links) passed or was
  # legitimately skipped, RED if any failed or was cancelled. Requiring this one
  # aggregate — instead of the dynamic, shard-numbered proof check names — keeps the
  # required-check list stable as the shard count changes. Runs on every event, so it
  # is also a single green signal on PRs.
  ci-green:
    name: ci-green
    needs: [plan, build, proofs, merge-verdict-cache, smoke, smoke-alpine, links]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The step's own `if` is the gate: it runs (and fails the job) only when a gating
      # job's result is failure/cancelled; otherwise it is skipped and ci-green is green.
      # (GitHub Actions expression string literals must be single-quoted.)
      - name: Block merge if any gating job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A gating job failed or was cancelled — merge blocked."
          exit 1

  # ── Snapshot publish + consumer test (push-to-main only) ──────────────────────
  #
  # On every push to main (and on a workflow_dispatch with snapshot=true, for
  # testing this flow), after the gate (build + every proof leg) is GREEN: publish
  # THIS commit's artifacts to GitHub Packages at a snapshot version, then dispatch
  # the bmc4j-consumer-test repo to install-and-prove that exact version. This is
  # the GitHub-Packages-only pre-Central channel; tagged releases (Maven Central +
  # the Plugin Portal) are untouched by this path.
  #
  # The snapshot version is <latest tag>-<short sha> (e.g. 0.1.0-ab12cd3): it sorts
  # below the next release, never collides with a real release, and the short sha
  # makes each main commit's artifacts independently resolvable. The build already
  # versions itself from BMC4J_VERSION, so the engine-jars/publish-core reusable
  # workflows publish at this version with no file edits.
  #
  # Forks can't access packages and shouldn't publish, so the whole flow is gated to
  # the canonical repo. PRs never reach here (the if excludes pull_request).
  snapshot-version:
    name: snapshot version
    needs: [build, proofs]
    if: >-
      github.repository == 'bmc4j/bmc4j' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.snapshot))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # describe --tags needs tag history; the default shallow checkout has none.
          fetch-depth: 0
      - name: Derive snapshot version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          # The latest release tag (vX.Y.Z) is the base; strip the leading v. If the
          # repo has no tags yet, fall back to 0.0.0 so the flow still produces a
          # well-formed, clearly-pre-release version.
          tag="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          base="${tag#v}"
          short="$(git rev-parse --short HEAD)"
          version="${base}-${short}"
          echo "Snapshot version: $version (tag=$tag sha=$short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Non-engine modules (runtime, plugin, models, kotlin, contracts, constraints) to
  # GitHub Packages at the snapshot version. Reuses publish-core.yml verbatim - the
  # same idempotent, skip-if-exists publish the release uses. centralStaging stays
  # false: snapshots never touch Maven Central.
  snapshot-publish-core:
    needs: snapshot-version
    uses: ./.github/workflows/publish-core.yml
    permissions:
      contents: read
      packages: write
    # Inherit the org secrets the reusable workflow reads. Reusable workflows do
    # NOT receive the caller's secrets implicitly, so without this the publish
    # step sees an EMPTY SIGNING_KEY, applies signing with a blank key, and dies
    # with "Could not read PGP secret key". centralStaging stays false (no Central
    # touch); the real key just keeps the snapshot artifacts signed like releases.
    secrets: inherit
    with:
      githubPackages: true
      centralStaging: false
      version: ${{ needs.snapshot-version.outputs.version }}

  # The three engine jars the consumer test actually runs on (its matrix is
  # ubuntu-latest / windows-latest / macos-14 = linux-x64, windows-x64,
  # macos-arm64). Each is assembled on its own OS by engine-jars.yml and published
  # at the snapshot version, so the plugin (which wires bmc-engine-<platform> at its
  # OWN version) resolves the matching snapshot engine on every consumer OS. The two
  # platforms the consumer test doesn't exercise (linux-arm64, macos-x64) are
  # skipped to save runner minutes - the release path publishes all five.
  snapshot-publish-engines:
    needs: snapshot-version
    uses: ./.github/workflows/engine-jars.yml
    permissions:
      contents: read
      packages: write
    with:
      platforms: linux-x64,windows-x64,macos-arm64
      publish: true
      centralStaging: false
      version: ${{ needs.snapshot-version.outputs.version }}

  # Trigger the consumer-test repo against the just-published snapshot, then WAIT
  # for and REFLECT its conclusion - this job goes red iff the consumer
  # install/proof run fails, which is the whole point of the issue.
  #
  # No PAT: the default GITHUB_TOKEN cannot trigger a workflow in ANOTHER repo, and
  # Courtney has decided no PAT will ever exist. Instead we PUSH a snapshot/<version>
  # branch to bmc4j-consumer-test over SSH using a WRITE DEPLOY KEY
  # (CONSUMER_TEST_DEPLOY_KEY). A deploy-key push triggers `on: push` workflows
  # normally - GitHub's "a GITHUB_TOKEN push doesn't re-trigger workflows" rule does
  # NOT apply to deploy-key pushes - so the consumer-test repo's `push:
  # snapshot/**` trigger fires and runs its matrix. The version travels in the
  # branch's single commit as bmc4j-version.txt (and in the branch name as a
  # fallback). We then POLL the consumer-test repo's runs (public reads, plain
  # GITHUB_TOKEN) for the run on head branch snapshot/<version> and mirror its
  # conclusion. The deploy key + secret are already provisioned (deploy key title
  # "bmc4j snapshot trigger" on bmc4j-consumer-test; secret CONSUMER_TEST_DEPLOY_KEY
  # on bmc4j/bmc4j).
  consumer-test:
    name: consumer test (snapshot)
    needs: [snapshot-version, snapshot-publish-core, snapshot-publish-engines]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Push snapshot branch (deploy key) and wait for the consumer run
        shell: bash
        env:
          # Public reads of the consumer-test repo's runs only - the default token
          # is enough; the cross-repo TRIGGER comes from the deploy-key push, not
          # from this token.
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.CONSUMER_TEST_DEPLOY_KEY }}
          VERSION: ${{ needs.snapshot-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::CONSUMER_TEST_DEPLOY_KEY is not set. Add the ed25519 PRIVATE key (whose public half is the 'bmc4j snapshot trigger' WRITE deploy key on bmc4j/bmc4j-consumer-test) as a secret named CONSUMER_TEST_DEPLOY_KEY."
            exit 1
          fi
          repo="bmc4j/bmc4j-consumer-test"
          branch="snapshot/${VERSION}"

          # Configure SSH with the deploy key (restricted perms, known_hosts pinned).
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/consumer_test_deploy_key
          chmod 600 ~/.ssh/consumer_test_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/consumer_test_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts"

          # Build the single-commit snapshot branch in a throwaway clone of the
          # consumer-test repo and push it. The deploy-key push fires the repo's
          # `push: snapshot/**` trigger. Force-push so a re-run of the SAME version
          # (e.g. a retried CI attempt) cleanly replaces a stale branch.
          work="$(mktemp -d)"
          git clone --depth 1 "git@github.com:${repo}.git" "$work"
          cd "$work"
          git config user.name "bmc4j-ci"
          git config user.email "ci@bmc4j.invalid"
          git checkout -b "$branch"
          printf '%s\n' "$VERSION" > bmc4j-version.txt
          git add bmc4j-version.txt
          git commit -m "snapshot: bmc4j ${VERSION}"
          git push --force origin "$branch"
          echo "Pushed $branch to $repo"
          cd - >/dev/null

          # Find the consumer-test run on this head branch (the push just created it;
          # poll briefly for it to register).
          workflow="consumer-test.yml"
          run_id=""
          for i in $(seq 1 30); do
            sleep 5
            run_id="$(gh run list --repo "$repo" --workflow "$workflow" \
              --branch "$branch" --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId' 2>/dev/null || true)"
            [ -n "$run_id" ] && [ "$run_id" != "null" ] && break
            run_id=""
          done
          [ -n "$run_id" ] || { echo "::error::could not locate the consumer-test run for $branch"; exit 1; }
          url="https://github.com/$repo/actions/runs/$run_id"
          echo "Consumer test run: $url"

          # Poll to completion and mirror the conclusion (~20 min budget, below the
          # job's own 40-min cap so we report a clear message instead of a hard
          # cancel). 120 iterations * 10s = 1200s = 20 min.
          for i in $(seq 1 120); do
            status="$(gh run view "$run_id" --repo "$repo" --json status --jq '.status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(gh run view "$run_id" --repo "$repo" --json conclusion --jq '.conclusion')"
              echo "Consumer test concluded: $conclusion ($url)"
              [ "$conclusion" = "success" ] && exit 0
              echo "::error::consumer test for $VERSION did not pass: $conclusion - see $url"
              exit 1
            fi
            sleep 10
          done
          echo "::error::consumer test run $url did not complete within ~20 min"
          exit 1
