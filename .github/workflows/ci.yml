name: CI

# One uniform shape: a `build` job (core build + unit tests, once, canonical JDK) and a
# `proofs` job - a single leg-matrix where every leg is "run this proof scope at JVM N
# (optionally with consumer-kotlinc V)". Host JDK == toolchain == bytecode target per
# leg (-PbmcJvmTarget), so a leg named jdk17 genuinely runs the shipped-floor runtime
# AND feeds 17-bytecode to the engine - no toolchain theater.
#
# Per-event legs (computed in `plan`):
#   push (main)   -> jdk17-floor (conformance), jdk21 + jdk25 (full suite),
#                    consumer-kotlin 2.0 + 2.2 + 2.3 (conformance + Kotlin examples,
#                    JVM 21), ALL platform smokes
#   pull_request  -> jdk21 full + one linux-arm64 smoke (fast feedback)
#   dispatch/call -> from the jdks/kotlins/platforms inputs
#
# The proof suites are green by design: the fail-on-purpose demos declare their
# expected verdicts (expect = REFUTED / VACUOUS / TIMEOUT / UNKNOWN). Every other
# platform gets a smoke job: one real proof class end-to-end, exercising that
# platform's engine jar assembly -> extraction -> an actual jbmc run. A docs
# link-check job guards the README/docs/examples cross-links.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: 'Run the build + proof legs (false = smokes/links only)'
        type: boolean
        default: true
      platforms:
        description: 'Smoke platforms: "all", "none", or comma-separated from windows-x64,linux-arm64,macos-x64,macos-arm64'
        default: all
      jdks:
        description: 'Comma-separated JDK proof legs (e.g. "17,21,25"; 17 runs conformance-only - examples need newer javac)'
        default: '21'
      kotlins:
        description: 'Comma-separated consumer-kotlinc proof legs (e.g. "2.0.21,2.2.21"; empty = none)'
        default: ''
      snapshot:
        description: 'Run the snapshot-publish + consumer-test legs (the push-to-main flow) for testing this branch'
        type: boolean
        default: false
  # Callable from the release workflow (full verification before publishing).
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: true
      platforms:
        type: string
        default: all
      jdks:
        type: string
        default: '21'
      kotlins:
        type: string
        default: ''

permissions:
  contents: read

# Force-pushes to a PR cancel its superseded runs; main pushes and dispatches
# never cancel mid-run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # matrix context isn't available in a job-level `if`, so the proof legs and the
  # smoke-platform filter are computed here and fed via fromJSON (same pattern as
  # engine-jars.yml). Every leg is one uniform shape: {name, jdk, kotlin, flags, tasks}.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
      any: ${{ steps.filter.outputs.any }}
      gate: ${{ steps.filter.outputs.gate }}
      legs: ${{ steps.filter.outputs.legs }}
    steps:
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          JDKS: ${{ inputs.jdks }}
          KOTLINS: ${{ inputs.kotlins }}
          GATE_INPUT: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          all='[
            {"runner":"windows-latest","platform":"windows-x64"},
            {"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},
            {"runner":"macos-15-intel","platform":"macos-x64"},
            {"runner":"macos-14","platform":"macos-arm64"}
          ]'

          # Proof scopes -> Gradle tasks. "conformance" is the model suite alone (the
          # JDK-17 floor leg: examples need newer javac); "full" is everything incl.
          # jarModelsConformanceTest (root `test` doesn't trigger `check`, and the
          # as-shipped JAR rewrite path needs explicit coverage); "kotlin" is the
          # conformance suite + every Kotlin-facing example.
          conformance=":model-conformance-proofs:test"
          full="test :model-conformance-proofs:jarModelsConformanceTest"
          kotlin=":model-conformance-proofs:test :examples:fundamentals-kotlin:test :examples:language-kotlin:test :examples:concurrency-kotlin:test :examples:integrations:test"

          # jdk_leg <jdk> / kotlin_leg <version>: one uniform leg each. Host JDK ==
          # toolchain == bytecode target (-PbmcJvmTarget), so the leg's name is the
          # truth. Consumer-kotlin legs run at JVM 21 (older KGPs have no JVM-25
          # target, and real older-Kotlin consumers run older JVMs).
          legs='[]'
          jdk_leg() {
            local jdk="$1" scope tasks
            if [ "$jdk" = "17" ]; then scope="conformance"; tasks="$conformance"; else scope="full"; tasks="$full"; fi
            legs="$(echo "$legs" | jq -c --arg j "$jdk" --arg t "$tasks" --arg s "$scope" \
              '. + [{name: ("jdk" + $j + "-" + $s), jdk: $j, flags: ("-PbmcJvmTarget=" + $j), tasks: $t}]')"
          }
          kotlin_leg() {
            # language-kotlin24 holds the 2.4-only syntax (context parameters, collection
            # literals) - older consumer compilers cannot build it, so only 2.4+ legs get it.
            local t="$kotlin"
            case "$1" in 2.[4-9]*|2.[1-9][0-9]*|[3-9].*) t="$t :examples:language-kotlin24:test";; esac
            legs="$(echo "$legs" | jq -c --arg v "$1" --arg t "$t" \
              '. + [{name: ("kotlin-" + $v), jdk: "21", flags: ("-PbmcJvmTarget=21 -PbmcKotlinVersion=" + $v), tasks: $t}]')"
          }

          # Per-event defaults; inputs.* are empty on push/PR events.
          case "$EVENT" in
            push)
              gate="true"; sel_spec="all"
              jdk_leg 17; jdk_leg 21; jdk_leg 25
              # 2.4 is also the default toolchain the full legs compile with, but it gets
              # its own EXPLICIT leg so the kotlin axis is self-contained - implicit
              # coverage would silently vanish the day the default bumps to 2.5.
              kotlin_leg 2.0.21; kotlin_leg 2.2.21; kotlin_leg 2.3.21; kotlin_leg 2.4.0
              ;;
            pull_request)
              gate="true"; sel_spec="linux-arm64"
              jdk_leg 21
              ;;
            *)
              gate="${GATE_INPUT:-true}"; sel_spec="${PLATFORMS:-all}"
              for j in $(echo "${JDKS:-21}" | tr ',' ' '); do jdk_leg "$j"; done
              for k in $(echo "${KOTLINS:-}" | tr ',' ' '); do [ -n "$k" ] && kotlin_leg "$k"; done
              ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

          if [ "$sel_spec" = "all" ]; then
            sel="$(echo "$all" | jq -c .)"
          elif [ "$sel_spec" = "none" ]; then
            sel='[]'
          else
            sel="$(echo "$all" | jq -c --arg p "$sel_spec" \
              '[ .[] | select(.platform as $x | ($p | split(",") | map(gsub("\\s";"")) | index($x)) != null) ]')"
            [ "$sel" != "[]" ] || { echo "No platforms matched '$sel_spec'"; exit 1; }
          fi
          echo "Event: $EVENT | gate: $gate | legs: $(echo "$legs" | jq -r '[.[].name] | join(", ")') | smoke: $(echo "$sel" | jq -r 'if length == 0 then "(none)" else [.[].platform] | join(", ") end')"
          echo "include=$sel" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$sel" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  # Core build + unit tests: once, on the canonical JDK. The proof legs validate the
  # runtime ON each JVM (their test processes actually run bmc-runtime at the leg's
  # JVM); this job validates that the product BUILDS clean (compile, unit tests,
  # javadoc/jar plumbing).
  build:
    name: build + unit tests
    needs: plan
    if: ${{ needs.plan.outputs.gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Core - build + unit tests
        run: ./gradlew -p core build --no-daemon

  # ONE uniform proof job: every leg is "run these proof tasks at this JVM with these
  # flags". -Dbmc.timeoutSeconds=180 keeps any SAT-pathological proof failing fast as
  # a NAMED UNKNOWN instead of hanging the job (per-proof budgets override it).
  proofs:
    name: proofs ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.gate == 'true' && needs.plan.outputs.legs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Persist bmc4j verdict caches across runs, one lineage per leg (different JVM
      # targets / kotlinc versions emit different bytecode -> different content keys;
      # the cache's own content-keying handles correctness, the cache key only scopes
      # WHICH snapshot gets restored). Key on run_id + run_attempt so every attempt
      # saves a fresh snapshot; restore-keys picks up the most recent prior one.
      #
      # Split restore/save (instead of actions/cache) so the snapshot is saved even
      # when the leg FAILS: the verdict cache only ever stores expectation-matching
      # verdicts (a flaky/failed/timed-out proof is never written), so a red leg's
      # cache holds exactly the proofs that did pass - the re-run restores it and
      # re-solves only what actually failed, instead of starting cold.
      - name: Restore verdict caches
        uses: actions/cache/restore@v5
        with:
          path: '**/build/bmc4j/verdict-cache'
          key: bmc-verdict-${{ runner.os }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bmc-verdict-${{ runner.os }}-${{ matrix.name }}-

      # --no-build-cache: Gradle's task cache would REPLAY test results for legs whose
      # inputs match another leg (it formally deduped the kotlin-2.3-default leg against
      # jdk21-full on its first run) - but these legs exist to PROVE each version
      # combination actually works, so the test JVMs must execute. Speed still comes
      # from the right layer: the per-proof verdict cache (restored above) skips the
      # SOLVES for anything unchanged, which also keeps that cache continuously
      # exercised in CI. Dependency caching (setup-gradle) is unaffected.
      - name: Proofs (${{ matrix.tasks }})
        shell: bash
        run: ./gradlew --no-daemon --no-build-cache -Dbmc.timeoutSeconds=180 ${{ matrix.flags }} ${{ matrix.tasks }}

      # always(): save the snapshot on failure too (see the restore step's comment) -
      # only expectation-matching verdicts are ever in it, so this is sound by
      # construction and lets a re-run continue from the failed proof.
      - name: Save verdict caches
        if: always()
        uses: actions/cache/save@v5
        with:
          path: '**/build/bmc4j/verdict-cache'
          key: bmc-verdict-${{ runner.os }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proofs-${{ matrix.name }}-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  smoke:
    name: smoke ${{ matrix.platform }}
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # One real proof class, end-to-end: assembles this platform's engine jar from
      # the (checksum-verified) upstream artifact, extracts the bundled jbmc, and
      # verifies actual proofs with it. bash on windows runs the sh wrapper fine.
      - name: One proof class end-to-end
        shell: bash
        run: ./gradlew :model-conformance-proofs:test --tests "proofs.optional.*" --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.platform }}-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Docs link check: the README/docs/examples cross-link web has broken before.
  # Offline mode = internal file links + anchors only (no network flakiness).
  # Cheap (seconds, 1x linux).
  links:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check internal doc links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress README.md CONTRIBUTING.md SECURITY.md THIRD-PARTY-NOTICES.md "docs/**/*.md" "examples/**/*.md"
          fail: true

  # ── Snapshot publish + consumer test (push-to-main only) ──────────────────────
  #
  # On every push to main (and on a workflow_dispatch with snapshot=true, for
  # testing this flow), after the gate (build + every proof leg) is GREEN: publish
  # THIS commit's artifacts to GitHub Packages at a snapshot version, then dispatch
  # the bmc4j-consumer-test repo to install-and-prove that exact version. This is
  # the GitHub-Packages-only pre-Central channel; tagged releases (Maven Central +
  # the Plugin Portal) are untouched by this path.
  #
  # The snapshot version is <latest tag>-<short sha> (e.g. 0.1.0-ab12cd3): it sorts
  # below the next release, never collides with a real release, and the short sha
  # makes each main commit's artifacts independently resolvable. The build already
  # versions itself from BMC4J_VERSION, so the engine-jars/publish-core reusable
  # workflows publish at this version with no file edits.
  #
  # Forks can't access packages and shouldn't publish, so the whole flow is gated to
  # the canonical repo. PRs never reach here (the if excludes pull_request).
  snapshot-version:
    name: snapshot version
    needs: [build, proofs]
    if: >-
      github.repository == 'bmc4j/bmc4j' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.snapshot))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # describe --tags needs tag history; the default shallow checkout has none.
          fetch-depth: 0
      - name: Derive snapshot version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          # The latest release tag (vX.Y.Z) is the base; strip the leading v. If the
          # repo has no tags yet, fall back to 0.0.0 so the flow still produces a
          # well-formed, clearly-pre-release version.
          tag="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          base="${tag#v}"
          short="$(git rev-parse --short HEAD)"
          version="${base}-${short}"
          echo "Snapshot version: $version (tag=$tag sha=$short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Non-engine modules (runtime, plugin, models, kotlin, contracts, constraints) to
  # GitHub Packages at the snapshot version. Reuses publish-core.yml verbatim - the
  # same idempotent, skip-if-exists publish the release uses. centralStaging stays
  # false: snapshots never touch Maven Central.
  snapshot-publish-core:
    needs: snapshot-version
    uses: ./.github/workflows/publish-core.yml
    permissions:
      contents: read
      packages: write
    with:
      githubPackages: true
      centralStaging: false
      version: ${{ needs.snapshot-version.outputs.version }}

  # The three engine jars the consumer test actually runs on (its matrix is
  # ubuntu-latest / windows-latest / macos-14 = linux-x64, windows-x64,
  # macos-arm64). Each is assembled on its own OS by engine-jars.yml and published
  # at the snapshot version, so the plugin (which wires bmc-engine-<platform> at its
  # OWN version) resolves the matching snapshot engine on every consumer OS. The two
  # platforms the consumer test doesn't exercise (linux-arm64, macos-x64) are
  # skipped to save runner minutes - the release path publishes all five.
  snapshot-publish-engines:
    needs: snapshot-version
    uses: ./.github/workflows/engine-jars.yml
    permissions:
      contents: read
      packages: write
    with:
      platforms: linux-x64,windows-x64,macos-arm64
      publish: true
      centralStaging: false
      version: ${{ needs.snapshot-version.outputs.version }}

  # Dispatch the consumer-test repo's "Consumer test" workflow against the just-
  # published snapshot, then WAIT for and REFLECT its conclusion - this job goes red
  # iff the consumer install/proof run fails, which is the whole point of the issue.
  #
  # Cross-repo dispatch: the default GITHUB_TOKEN cannot trigger a workflow in
  # ANOTHER repo, so this uses CONSUMER_TEST_DISPATCH_TOKEN (a fine-grained PAT with
  # actions:write on bmc4j-consumer-test). If that secret is absent the job fails
  # fast with an explicit, actionable message rather than a cryptic 404 - creating
  # the PAT is the one owner-only step (documented in the PR).
  consumer-test:
    name: consumer test (snapshot)
    needs: [snapshot-version, snapshot-publish-core, snapshot-publish-engines]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch consumer test and wait for its conclusion
        shell: bash
        env:
          # A PAT, not GITHUB_TOKEN: cross-repo workflow_dispatch + reading the
          # dispatched run's status both require a token scoped to the other repo.
          GH_TOKEN: ${{ secrets.CONSUMER_TEST_DISPATCH_TOKEN }}
          VERSION: ${{ needs.snapshot-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONSUMER_TEST_DISPATCH_TOKEN is not set. Create a fine-grained PAT with actions:write on bmc4j/bmc4j-consumer-test and add it as a repo/org secret named CONSUMER_TEST_DISPATCH_TOKEN (owner-only step)."
            exit 1
          fi
          repo="bmc4j/bmc4j-consumer-test"
          workflow="consumer-test.yml"

          # workflow_dispatch returns no run id, so stamp a unique marker BEFORE
          # dispatching and find the run whose head matches it. We pass VERSION as
          # the input; the marker is the dispatch time, used only to disambiguate.
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Dispatching $workflow in $repo for version $VERSION (at $before)"
          gh workflow run "$workflow" --repo "$repo" -f version="$VERSION"

          # Find the run we just created: the newest run of this workflow created at
          # or after our dispatch timestamp. Poll briefly - the run can take a few
          # seconds to register.
          run_id=""
          for i in $(seq 1 30); do
            sleep 5
            run_id="$(gh run list --repo "$repo" --workflow "$workflow" \
              --created ">=$before" --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId' 2>/dev/null || true)"
            [ -n "$run_id" ] && [ "$run_id" != "null" ] && break
            run_id=""
          done
          [ -n "$run_id" ] || { echo "::error::could not locate the dispatched consumer-test run"; exit 1; }
          url="https://github.com/$repo/actions/runs/$run_id"
          echo "Consumer test run: $url"

          # Poll to completion and mirror the conclusion. Timeout below the job's own
          # 40-min budget so we report a clear message instead of a hard cancel.
          for i in $(seq 1 200); do
            status="$(gh run view "$run_id" --repo "$repo" --json status,conclusion --jq '.status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(gh run view "$run_id" --repo "$repo" --json conclusion --jq '.conclusion')"
              echo "Consumer test concluded: $conclusion ($url)"
              [ "$conclusion" = "success" ] && exit 0
              echo "::error::consumer test for $VERSION did not pass: $conclusion - see $url"
              exit 1
            fi
            sleep 10
          done
          echo "::error::consumer test run $url did not complete in time"
          exit 1
