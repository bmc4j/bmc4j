name: Release

# Tag-driven release. The whole flow is:
#
#   1. Bump bmc4jVersion in core/gradle.properties + the README quickstart, merge.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow builds + verifies AT THAT TAG, then publishes everything:
#        preflight        tag == bmc4jVersion == README quickstart
#        verify           ci.yml (full gate + every platform smoke)
#        engines          all five engine jars built + smoke-checked; GH Packages
#                         publish (skips any version already up there, so re-runs
#                         never 409); signed Central staging artifacts
#        publish-core     non-engine modules: same GH Packages + staging treatment
#        central          ONE signed Portal bundle (.asc/.sha1/.md5 verified per
#                         file), uploaded publishingType=AUTOMATIC - Sonatype
#                         validation-gates it, then publishes; the job polls to
#                         PUBLISHED. Central is immutable: the tag push is the
#                         deliberate act, there is no unpublish.
#        plugin-portal    waits for the artifacts to be LIVE on repo1 (a Portal-
#                         resolved plugin must find its runtime deps on Central),
#                         then publishPlugins to the Gradle Plugin Portal
#        github-release   release notes on the tag (--generate-notes)
#
# Every job is re-runnable: if repo1 sync outlasts the plugin-portal poll, or any
# leg flakes, "Re-run failed jobs" resumes exactly there (publishes are idempotent
# - GH Packages legs skip what exists, Central rejects a duplicate bundle loudly,
# publishPlugins of an existing version fails loudly rather than silently).
#
# workflow_dispatch is the REHEARSAL: identical build + verify + bundle assembly
# + Plugin Portal credential/metadata validation, publishes and tags NOTHING.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # release-notes creation on the tag
  packages: write   # GH Packages publishing (via the called workflows)

# One release at a time; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Version consistency
        id: v
        shell: bash
        run: |
          set -euo pipefail
          prop="$(grep -E '^bmc4jVersion=' core/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            [ "$version" = "$prop" ] || { echo "::error::tag ${GITHUB_REF_NAME} != bmc4jVersion '$prop' - bump core/gradle.properties BEFORE tagging"; exit 1; }
          else
            version="$prop"   # rehearsal: whatever the branch says
          fi
          grep -q "id(\"org.bmc4j\") version \"$version\"" README.md \
            || { echo "::error::README quickstart does not reference version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (real publish: ${{ github.event_name == 'push' }})"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      gate: true
      platforms: all
      jdks: '21'

  engines:
    needs: preflight
    uses: ./.github/workflows/engine-jars.yml
    secrets: inherit
    with:
      platforms: all
      publish: ${{ github.event_name == 'push' }}
      centralStaging: true

  publish-core:
    needs: verify
    uses: ./.github/workflows/publish-core.yml
    secrets: inherit
    with:
      githubPackages: ${{ github.event_name == 'push' }}
      centralStaging: true

  # Assemble + verify the Maven Central bundle; on a tag, upload it AUTOMATIC and
  # poll to PUBLISHED. The Portal takes ONE zip of the whole maven-repo layout -
  # every staging artifact (five engine platforms + the core set) merges into it.
  central:
    needs: [preflight, engines, publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download staging artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: central-staging-*
          path: staging/
          merge-multiple: true

      - name: Assemble + verify bundle
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # The Portal generates maven-metadata.xml itself; shipping ours trips validation.
          find staging -name 'maven-metadata.xml*' -delete
          # Every artifact file must carry a signature and the required checksums.
          missing=0
          while IFS= read -r f; do
            for suffix in .asc .md5 .sha1; do
              [ -f "$f$suffix" ] || { echo "::error::missing $f$suffix"; missing=1; }
            done
          done < <(find staging -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \))
          [ "$missing" = 0 ] || exit 1
          count=$(find staging -type f \( -name '*.jar' -o -name '*.pom' \) | wc -l)
          echo "Bundle: $count jars/poms across $(find staging -mindepth 3 -maxdepth 3 -type d | wc -l) coordinates"
          (cd staging && zip -qr "../bmc4j-$VERSION-bundle.zip" .)
          ls -lh "bmc4j-$VERSION-bundle.zip"

      # The exact bytes a real release uploads - inspectable on rehearsals.
      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: bmc4j-${{ needs.preflight.outputs.version }}-bundle.zip
          if-no-files-found: error

      - name: Publish to Maven Central (AUTOMATIC)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          id="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $token" \
            -F "bundle=@bmc4j-$VERSION-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=bmc4j-$VERSION&publishingType=AUTOMATIC")"
          echo "Deployment id: $id"
          # AUTOMATIC: Sonatype validates, then publishes on its own - poll to PUBLISHED.
          for i in $(seq 1 120); do
            sleep 15
            state="$(curl -sS -H "Authorization: Bearer $token" -X POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id")"
            status="$(echo "$state" | jq -r .deploymentState)"
            echo "[$i] $status"
            case "$status" in
              PUBLISHED) echo "Deployment PUBLISHED."; exit 0 ;;
              FAILED) echo "::error::Central validation failed"; echo "$state" | jq .; exit 1 ;;
            esac
          done
          echo "::error::deployment $id did not reach PUBLISHED within 30 minutes - check central.sonatype.com -> Deployments, then re-run the plugin-portal job"
          exit 1

  # Gradle Plugin Portal. On a tag: wait until the artifacts are LIVE on repo1
  # (Portal-resolved plugins must find their runtime deps on Central; Central ->
  # repo1 sync can lag publication by many minutes), then publish for real. On a
  # rehearsal: --validate-only, which still authenticates (bad keys are rejected),
  # so it proves credentials AND metadata. First-ever publish of a new plugin id
  # additionally sits in the Portal team's manual approval queue.
  plugin-portal:
    needs: [preflight, central]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for repo1 sync
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for a in bmc-runtime bmc-gradle-plugin; do
            url="https://repo1.maven.org/maven2/org/bmc4j/$a/$VERSION/$a-$VERSION.pom"
            for i in $(seq 1 75); do
              curl -sf -o /dev/null "$url" && { echo "$a live"; break; }
              [ "$i" = 75 ] && { echo "::error::$a $VERSION not on repo1 after 75 minutes - re-run this job once it lands"; exit 1; }
              sleep 60
            done
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to the Plugin Portal
        shell: bash
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew -p core :bmc-gradle-plugin:publishPlugins --no-daemon
          ${{ github.event_name != 'push' && '--validate-only' || '' }}

  github-release:
    if: ${{ github.event_name == 'push' }}
    needs: [preflight, central, plugin-portal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Release notes on the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "bmc4j ${{ needs.preflight.outputs.version }}" \
            --generate-notes
