name: All checks pass
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  allchecks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: wechuli/allcheckspassed@v2
        with:
          # The default 10x1m polling window expires before the ~10-15m proof legs
          # finish, failing this check even when every real check ends green.
          # Keep polling for up to ~30m so the verdict reflects the actual checks.
          polling_interval: 1
          retries: 30
