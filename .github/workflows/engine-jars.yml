name: Engine jars (per-platform)

# Manual dispatch ONLY (private repo + limited CI minutes; macOS billed 10x), and
# each engine jar can only be ASSEMBLED on its own OS. Also callable from the
# release workflow (workflow_call) with publishing toggleable for dry runs.
# It assembles each platform's bmc-engine-<platform> jar from the upstream CBMC
# 6.9.0 artifact (SHA-256 verified), smoke-checks the bundled jbmc, uploads the
# jar as a build artifact, and (unless publish=false) publishes to GitHub Packages.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build: "all" or comma-separated from windows-x64,linux-x64,linux-x64-musl,linux-arm64,macos-x64,macos-arm64 (avoids republishing already-published jars - GitHub Packages rejects overwrites)'
        default: all
      publish:
        description: 'Publish to GitHub Packages (false = build + smoke-check only)'
        type: boolean
        default: true
      centralStaging:
        description: 'Also publish each engine jar (signed) to a local staging repo and upload it as a central-staging-<platform> artifact for the release workflow''s Maven Central bundle'
        type: boolean
        default: false
      version:
        description: 'Version to build/publish as (the release workflow passes the tag version - the tag is the source of truth; surfaced to Gradle as BMC4J_VERSION). Empty = the 0.0.1-local dev default; publishing then refuses to run.'
        type: string
        default: ''
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
      publish:
        type: boolean
        default: true
      centralStaging:
        type: boolean
        default: false
      version:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # matrix context isn't available in a job-level `if`, so the platform filter
  # is computed here and fed to the engine job via fromJSON.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.filter.outputs.include }}
      musl: ${{ steps.filter.outputs.musl }}
    steps:
      - id: filter
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          # macos-13 (the old Intel label) is retired - macos-15-intel is the
          # current GitHub-hosted Intel image. The sonoma x64 bottle runs fine on it.
          #
          # linux-x64-musl is NOT in this matrix: it can't be built with a runner-native
          # toolchain (it needs a musl toolchain), so it runs in its own `engine-musl` job
          # inside an alpine container. The musl flag below toggles that job. Everything
          # else (a runner-native, OS-matched assembly) lives in this matrix.
          all='[
            {"runner":"windows-latest","platform":"windows-x64"},
            {"runner":"ubuntu-latest","platform":"linux-x64"},
            {"runner":"ubuntu-24.04-arm","platform":"linux-arm64"},
            {"runner":"macos-15-intel","platform":"macos-x64"},
            {"runner":"macos-14","platform":"macos-arm64"}
          ]'
          spec="${PLATFORMS:-all}"
          if [ "$spec" = "all" ]; then
            sel="$(echo "$all" | jq -c .)"
            musl="true"
          else
            sel="$(echo "$all" | jq -c --arg p "$spec" \
              '[ .[] | select(.platform as $x | ($p | split(",") | map(gsub("\\s";"")) | index($x)) != null) ]')"
            # linux-x64-musl lives outside the runner matrix; select it independently.
            if echo "$spec" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -qx 'linux-x64-musl'; then
              musl="true"
            else
              musl="false"
            fi
          fi
          if [ "$sel" = "[]" ] && [ "$musl" != "true" ]; then
            echo "No platforms matched '$spec'"; exit 1
          fi
          echo "Building: $(echo "$sel" | jq -r '[.[].platform] | join(", ")')$([ "$musl" = "true" ] && echo ", linux-x64-musl")"
          echo "include=$sel" >> "$GITHUB_OUTPUT"
          echo "musl=$musl" >> "$GITHUB_OUTPUT"

  engine:
    name: ${{ matrix.platform }}
    needs: plan
    if: ${{ needs.plan.outputs.include != '[]' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    # The tag is the version's source of truth: the build reads BMC4J_VERSION
    # (empty -> the 0.0.1-local dev default), so every Gradle step in this job
    # builds/publishes at the requested version with no file edits.
    env:
      BMC4J_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Cache the EXTRACTED engine so prepareEngine no-ops on a hit and skips the
      # release-CDN download (the transient-504 source). Each matrix platform caches
      # its own arch/os-scoped engine dir. cbmc version + the engine build.gradle.kts
      # hash invalidate on a bump or download-logic change (re-download SHA-256-verified).
      - name: Cache engine (${{ matrix.platform }})
        uses: actions/cache@v4
        with:
          path: |
            core/bmc-engine-${{ matrix.platform }}/build/engine
            core/bmc-engine-${{ matrix.platform }}/build/download
          key: bmc-engine-${{ matrix.platform }}-cbmc6.9.0-${{ hashFiles('core/bmc-engine-*/build.gradle.kts') }}
          restore-keys: |
            bmc-engine-${{ matrix.platform }}-cbmc6.9.0-

      - name: Build engine jar
        shell: bash
        run: ./gradlew -p core :bmc-engine-${{ matrix.platform }}:build --no-daemon

      # Extraction uses `jar xf` (ships with the JDK) rather than unzip, which the
      # windows runner's git-bash doesn't have.
      - name: Smoke-check bundled jbmc
        shell: bash
        run: |
          set -euo pipefail
          libs="core/bmc-engine-${{ matrix.platform }}/build/libs"
          # Exclude the -javadoc/-sources classifier jars (added by the Central
          # publishing prereqs) - the engine binary lives in the main jar only.
          jarfile="$(cd "$libs" && ls bmc-engine-${{ matrix.platform }}-*.jar | grep -vE -- '-(javadoc|sources)\.jar$' | head -n1)"
          echo "Inspecting $libs/$jarfile"
          exe="jbmc"
          [[ "${{ runner.os }}" == "Windows" ]] && exe="jbmc.exe"
          work="$(mktemp -d)"
          cp "$libs/$jarfile" "$work/"
          (cd "$work" && jar xf "$jarfile" "jbmc/${{ matrix.platform }}/bin/$exe")
          bin="$work/jbmc/${{ matrix.platform }}/bin/$exe"
          chmod +x "$bin"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # A relocated bottle binary may be quarantined / need an ad-hoc signature.
            xattr -dr com.apple.quarantine "$bin" || true
            codesign --force --sign - "$bin" || true
          fi
          out="$("$bin" --version)"
          echo "jbmc --version => $out"
          echo "$out" | grep -q "6.9.0" || { echo "Expected jbmc version 6.9.0, got: $out"; exit 1; }

      # Bundled-but-unused KISSAT: prove it is packed into the jar and runs --version.
      # kissat is OPTIONAL on windows-x64 (no upstream Windows build): if the jar has
      # no kissat entry there, that's expected and the step passes without running it.
      - name: Smoke-check bundled kissat
        shell: bash
        run: |
          set -euo pipefail
          libs="core/bmc-engine-${{ matrix.platform }}/build/libs"
          jarfile="$(cd "$libs" && ls bmc-engine-${{ matrix.platform }}-*.jar | grep -vE -- '-(javadoc|sources)\.jar$' | head -n1)"
          kbin="kissat"
          [[ "${{ runner.os }}" == "Windows" ]] && kbin="kissat.exe"
          entry="jbmc/${{ matrix.platform }}/bin/$kbin"
          work="$(mktemp -d)"
          cp "$libs/$jarfile" "$work/"
          if (cd "$work" && jar tf "$jarfile" | grep -qx "$entry"); then
            (cd "$work" && jar xf "$jarfile" "$entry" "jbmc/${{ matrix.platform }}/KISSAT-LICENSE")
            bin="$work/$entry"
            chmod +x "$bin"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              xattr -dr com.apple.quarantine "$bin" || true
              codesign --force --sign - "$bin" || true
            fi
            echo "kissat --version => $("$bin" --version)"
            test -f "$work/jbmc/${{ matrix.platform }}/KISSAT-LICENSE" || { echo "KISSAT-LICENSE missing from jar"; exit 1; }
          elif [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            echo "kissat not bundled for windows-x64 (expected: no upstream Windows build) - skipping"
          else
            echo "::error::kissat binary $entry missing from $jarfile"; exit 1
          fi

      - name: Upload engine jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: bmc-engine-${{ matrix.platform }}
          path: core/bmc-engine-${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error

      # Skip-if-exists makes release re-runs idempotent: GH Packages rejects
      # overwrites with a 409, so a re-run after a partial failure would otherwise
      # die on the jars that DID publish. Publishing requires an explicit version -
      # the 0.0.1-local dev default must never reach a registry.
      - name: Publish to GitHub Packages
        # Best-effort secondary mirror (Maven Central is authoritative): a GHP failure - the
        # recurring 409 on an already-published version, a flaky upload - must not sink the release.
        continue-on-error: true
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${BMC4J_VERSION:-}" ] || { echo "::error::no version provided - refusing to publish the 0.0.1-local dev default; pass the version input"; exit 1; }
          mod="bmc-engine-${{ matrix.platform }}"
          if curl -sf -o /dev/null -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              "https://maven.pkg.github.com/${{ github.repository }}/org/bmc4j/$mod/$BMC4J_VERSION/$mod-$BMC4J_VERSION.pom"; then
            echo "$mod $BMC4J_VERSION already on GitHub Packages - skipping"
            exit 0
          fi
          # The curl pre-check can race / lag GHP's index, so a jar it judged absent can still 409.
          # A 409 means the version is already published (the desired end state), so treat just that
          # as success and keep the publish idempotent; any other failure still fails the job.
          ./gradlew -p core ":$mod:publishMavenPublicationToGitHubPackagesRepository" --no-daemon 2>&1 | tee publish-ghp.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -qiE "status code 409|409 *conflict|conflict.*409|already exists" publish-ghp.log \
              && { echo "::notice::$mod $BMC4J_VERSION already on GitHub Packages (409) - idempotent"; exit 0; }
            exit "$status"
          fi

      # Maven Central staging: publish this platform's engine jar (signed - Central
      # requires .asc on every file) into a local directory repo and hand it to the
      # release workflow as an artifact. The release workflow merges every platform's
      # staging dir into ONE Portal bundle. The publish-time guard in core/build.gradle.kts
      # still applies: an empty placeholder jar can never be staged.
      - name: Publish to Central staging artifact
        if: ${{ inputs.centralStaging }}
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew -p core
          -PcentralStagingDir="$GITHUB_WORKSPACE/central-staging"
          :bmc-engine-${{ matrix.platform }}:publishMavenPublicationToCentralStagingRepository
          --no-daemon

      - name: Upload Central staging artifact
        if: ${{ inputs.centralStaging }}
        uses: actions/upload-artifact@v7
        with:
          name: central-staging-${{ matrix.platform }}
          path: central-staging/
          if-no-files-found: error

  # linux-x64-musl: the engine binary must be MUSL-linked, and upstream CBMC ships
  # only glibc artifacts, so the static musl jbmc is built (once per CBMC bump) in a
  # dedicated builder repo (bmc4j/jbmc-musl-builds) and published there as a release
  # asset. This module's prepareEngine then FETCHES that prebuilt tarball and
  # SHA-256-verifies it - exactly like every other platform fetches its upstream
  # artifact - so NO compiler runs here and assembly takes ~seconds.
  #
  # Because assembly is now just fetch + tar-extract, this runs on a normal
  # ubuntu-latest runner with the marketplace setup-java/setup-gradle actions, like
  # the rest of the matrix. The musl binary can't run on the glibc runner, so the
  # binary `--version` smoke runs in a throwaway alpine container (`docker run`).
  engine-musl:
    name: linux-x64-musl
    needs: plan
    if: ${{ needs.plan.outputs.musl == 'true' }}
    runs-on: ubuntu-latest
    env:
      BMC4J_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Cache the EXTRACTED musl engine so prepareEngine no-ops on a hit and skips the
      # release-asset download (bmc4j/jbmc-musl-builds, same transient-504 CDN). Own
      # musl-specific key; cbmc version + the engine build.gradle.kts hash invalidate
      # on a bump or download-logic change (re-download stays SHA-256-verified).
      - name: Cache engine (linux-x64-musl)
        uses: actions/cache@v4
        with:
          path: |
            core/bmc-engine-linux-x64-musl/build/engine
            core/bmc-engine-linux-x64-musl/build/download
          key: bmc-engine-linux-x64-musl-cbmc6.9.0-${{ hashFiles('core/bmc-engine-*/build.gradle.kts') }}
          restore-keys: |
            bmc-engine-linux-x64-musl-cbmc6.9.0-

      - name: Build musl engine jar
        shell: bash
        run: ./gradlew -p core :bmc-engine-linux-x64-musl:build --no-daemon

      - name: Smoke-check bundled jbmc (musl, in alpine)
        shell: bash
        run: |
          set -euo pipefail
          libs="core/bmc-engine-linux-x64-musl/build/libs"
          jarfile="$(cd "$libs" && ls bmc-engine-linux-x64-musl-*.jar | grep -vE -- '-(javadoc|sources)\.jar$' | head -n1)"
          echo "Inspecting $libs/$jarfile"
          work="$(mktemp -d)"
          cp "$libs/$jarfile" "$work/"
          (cd "$work" && jar xf "$jarfile" "jbmc/linux-x64-musl/bin/jbmc")
          bin="$work/jbmc/linux-x64-musl/bin/jbmc"
          chmod +x "$bin"
          # The binary is statically musl-linked; run it in a throwaway alpine
          # container to prove it executes under musl and reports the right version.
          out="$(docker run --rm -v "$work:/w" alpine:3.20 /w/jbmc/linux-x64-musl/bin/jbmc --version)"
          echo "jbmc --version => $out"
          echo "$out" | grep -q "6.9.0" || { echo "Expected jbmc version 6.9.0, got: $out"; exit 1; }

      - name: Smoke-check bundled kissat (musl, in alpine)
        shell: bash
        run: |
          set -euo pipefail
          libs="core/bmc-engine-linux-x64-musl/build/libs"
          jarfile="$(cd "$libs" && ls bmc-engine-linux-x64-musl-*.jar | grep -vE -- '-(javadoc|sources)\.jar$' | head -n1)"
          entry="jbmc/linux-x64-musl/bin/kissat"
          work="$(mktemp -d)"
          cp "$libs/$jarfile" "$work/"
          (cd "$work" && jar tf "$jarfile" | grep -qx "$entry") || { echo "::error::kissat binary $entry missing from $jarfile"; exit 1; }
          (cd "$work" && jar xf "$jarfile" "$entry" "jbmc/linux-x64-musl/KISSAT-LICENSE")
          chmod +x "$work/$entry"
          # Static musl binary: run under alpine to prove it executes there.
          echo "kissat --version => $(docker run --rm -v "$work:/w" alpine:3.20 /w/$entry --version)"
          test -f "$work/jbmc/linux-x64-musl/KISSAT-LICENSE" || { echo "KISSAT-LICENSE missing from jar"; exit 1; }

      - name: Upload engine jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: bmc-engine-linux-x64-musl
          path: core/bmc-engine-linux-x64-musl/build/libs/*.jar
          if-no-files-found: error

      - name: Publish to GitHub Packages
        # Best-effort secondary mirror (Maven Central is authoritative): a GHP failure - the
        # recurring 409 on an already-published version, a flaky upload - must not sink the release.
        continue-on-error: true
        if: ${{ inputs.publish }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${BMC4J_VERSION:-}" ] || { echo "::error::no version provided - refusing to publish the 0.0.1-local dev default; pass the version input"; exit 1; }
          mod="bmc-engine-linux-x64-musl"
          if curl -sf -o /dev/null -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              "https://maven.pkg.github.com/${{ github.repository }}/org/bmc4j/$mod/$BMC4J_VERSION/$mod-$BMC4J_VERSION.pom"; then
            echo "$mod $BMC4J_VERSION already on GitHub Packages - skipping"
            exit 0
          fi
          # The curl pre-check can race / lag GHP's index, so a jar it judged absent can still 409.
          # A 409 means the version is already published (the desired end state), so treat just that
          # as success and keep the publish idempotent; any other failure still fails the job.
          ./gradlew -p core ":$mod:publishMavenPublicationToGitHubPackagesRepository" --no-daemon 2>&1 | tee publish-ghp.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -qiE "status code 409|409 *conflict|conflict.*409|already exists" publish-ghp.log \
              && { echo "::notice::$mod $BMC4J_VERSION already on GitHub Packages (409) - idempotent"; exit 0; }
            exit "$status"
          fi

      - name: Publish to Central staging artifact
        if: ${{ inputs.centralStaging }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew -p core
          -PcentralStagingDir="$GITHUB_WORKSPACE/central-staging"
          :bmc-engine-linux-x64-musl:publishMavenPublicationToCentralStagingRepository
          --no-daemon

      - name: Upload Central staging artifact
        if: ${{ inputs.centralStaging }}
        uses: actions/upload-artifact@v7
        with:
          name: central-staging-linux-x64-musl
          path: central-staging/
          if-no-files-found: error
