name: Publish core modules

# Publishes the NON-ENGINE module set (runtime, gradle plugin + its org.bmc4j
# marker, models, kotlin, contracts, constraints) to GitHub Packages, and
# optionally stages the same set (signed) for the release workflow's Maven
# Central bundle. The five bmc-engine-<platform> jars are published separately
# by engine-jars.yml — each can only be assembled on its own OS; everything
# here is plain JVM.
#
# GitHub Packages' Maven endpoint costs a fixed ~30s per publication (every PUT
# of jar/sources/javadoc/pom/module + .asc + checksums is a redirect round-trip),
# independent of artifact size - a tiny plain-JVM jar is as slow as a big one.
# Gradle serialises PublishToMavenRepository tasks that target one repository, so
# publishing all seven modules in a single Gradle run pays that latency back-to-back
# (~7x30s of pure upload wall-clock). The GHP leg therefore fans out across a matrix
# (one runner per module, mirroring engine-jars.yml) so the round-trips overlap and
# there is no shared-filesystem Gradle lock contention. Central staging stays a
# single job (release-only; it merges all modules into one artifact).
#
# GitHub Packages rejects overwrites; the GHP leg skips already-published modules
# per-version (computed once in `plan`), so re-runs are idempotent.
#
# Also callable from the release workflow (workflow_call), which passes the
# tag version - the tag is the source of truth, pinned into gradle.properties.

on:
  workflow_dispatch:
    inputs:
      githubPackages:
        description: 'Publish to GitHub Packages'
        type: boolean
        default: true
      centralStaging:
        description: 'Also publish the set (signed) to a local staging repo and upload it as the central-staging-core artifact for the release workflow''s Maven Central bundle'
        type: boolean
        default: false
      version:
        description: 'Version to build/publish as (the release workflow passes the tag version - the tag is the source of truth; surfaced to Gradle as BMC4J_VERSION). Empty = the 0.0.1-local dev default; publishing then refuses to run.'
        type: string
        default: ''
  workflow_call:
    inputs:
      githubPackages:
        type: boolean
        default: true
      centralStaging:
        type: boolean
        default: false
      version:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # Compute the module set the GHP matrix should publish: the full non-engine list
  # minus anything already on GitHub Packages at this version (GHP rejects overwrites
  # with 409, so skip-if-exists keeps re-runs idempotent). Doing it once here means a
  # re-run after a partial failure only fans out the modules that still need it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
    steps:
      - id: plan
        if: ${{ inputs.githubPackages }}
        shell: bash
        env:
          BMC4J_VERSION: ${{ inputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${BMC4J_VERSION:-}" ] || { echo "::error::no version provided - refusing to publish the 0.0.1-local dev default; pass the version input"; exit 1; }
          todo='[]'
          for mod in bmc-runtime bmc-gradle-plugin bmc-models bmc-kotlin bmc-contracts bmc-constraints bmc-constraints-jakarta; do
            if curl -sf -o /dev/null -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
                "https://maven.pkg.github.com/${{ github.repository }}/org/bmc4j/$mod/$BMC4J_VERSION/$mod-$BMC4J_VERSION.pom"; then
              echo "$mod $BMC4J_VERSION already on GitHub Packages - skipping"
            else
              todo="$(echo "$todo" | jq -c --arg m "$mod" '. + [$m]')"
            fi
          done
          echo "To publish: $(echo "$todo" | jq -r 'join(", ")')"
          echo "modules=$todo" >> "$GITHUB_OUTPUT"

  # One runner per module so GitHub Packages' fixed per-publication latency overlaps
  # instead of summing. Each module's plain-JVM build is cheap (a few seconds of
  # compile); runners are parallel, so total wall-clock collapses to roughly one
  # module's build + one ~30s upload regardless of module count.
  publish-ghp:
    needs: plan
    if: ${{ inputs.githubPackages && needs.plan.outputs.modules != '[]' && needs.plan.outputs.modules != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    # The tag is the version's source of truth: the build reads BMC4J_VERSION
    # (empty -> the 0.0.1-local dev default), so every Gradle step publishes at the
    # requested version with no file edits.
    env:
      BMC4J_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Signing is conditional in the build (applies only when SIGNING_KEY is
      # present). GitHub Packages doesn't require signatures, but signing here keeps
      # the published artifacts identical to the Central-bound ones and exercises the
      # signing path on every publish.
      - name: Publish ${{ matrix.module }} to GitHub Packages
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${BMC4J_VERSION:-}" ] || { echo "::error::no version provided - refusing to publish the 0.0.1-local dev default; pass the version input"; exit 1; }
          ./gradlew -p core --no-daemon ":${{ matrix.module }}:publishAllPublicationsToGitHubPackagesRepository"

  # Maven Central staging: the whole module set into one local directory repo (signed -
  # Central requires .asc on every file), handed to the release workflow as a single
  # artifact to merge into the Portal bundle alongside the per-platform engine jars.
  # Release-only (centralStaging) and rare, so it stays a single job - the bundle must
  # be one merged maven-repo layout, which a per-module fan-out would fragment.
  central-staging:
    if: ${{ inputs.centralStaging }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BMC4J_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Central staging artifact
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew -p core --no-daemon
          -PcentralStagingDir="$GITHUB_WORKSPACE/central-staging"
          :bmc-runtime:publishAllPublicationsToCentralStagingRepository
          :bmc-gradle-plugin:publishAllPublicationsToCentralStagingRepository
          :bmc-models:publishAllPublicationsToCentralStagingRepository
          :bmc-kotlin:publishAllPublicationsToCentralStagingRepository
          :bmc-contracts:publishAllPublicationsToCentralStagingRepository
          :bmc-constraints:publishAllPublicationsToCentralStagingRepository
          :bmc-constraints-jakarta:publishAllPublicationsToCentralStagingRepository

      - name: Upload Central staging artifact
        uses: actions/upload-artifact@v7
        with:
          name: central-staging-core
          path: central-staging/
          if-no-files-found: error
