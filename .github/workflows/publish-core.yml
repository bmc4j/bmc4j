name: Publish core modules

# Publishes the NON-ENGINE module set (runtime, gradle plugin + its org.bmc4j
# marker, models, kotlin, contracts, constraints) to GitHub Packages, and
# optionally stages the same set (signed) for the release workflow's Maven
# Central bundle. The five bmc-engine-<platform> jars are published separately
# by engine-jars.yml — each can only be assembled on its own OS; everything
# here is plain JVM and publishes from one linux runner.
#
# GitHub Packages rejects overwrites; the GHP leg skips already-published
# modules per-version, so re-runs are idempotent.
#
# Also callable from the release workflow (workflow_call), which passes the
# tag version - the tag is the source of truth, pinned into gradle.properties.

on:
  workflow_dispatch:
    inputs:
      githubPackages:
        description: 'Publish to GitHub Packages'
        type: boolean
        default: true
      centralStaging:
        description: 'Also publish the set (signed) to a local staging repo and upload it as the central-staging-core artifact for the release workflow''s Maven Central bundle'
        type: boolean
        default: false
      version:
        description: 'Version to build/publish as (the release workflow passes the tag version - the tag is the source of truth; surfaced to Gradle as BMC4J_VERSION). Empty = the 0.0.1-local dev default; publishing then refuses to run.'
        type: string
        default: ''
  workflow_call:
    inputs:
      githubPackages:
        type: boolean
        default: true
      centralStaging:
        type: boolean
        default: false
      version:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tag is the version's source of truth: the build reads BMC4J_VERSION
    # (empty -> the 0.0.1-local dev default), so every Gradle step in this job
    # builds/publishes at the requested version with no file edits.
    env:
      BMC4J_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Signing is conditional in the build (applies only when SIGNING_KEY is
      # present). GitHub Packages doesn't require signatures, but signing here
      # keeps the published artifacts identical to the Central-bound ones and
      # exercises the signing path on every publish. Per-module skip-if-exists
      # makes re-runs idempotent: GH Packages rejects overwrites with a 409, so a
      # re-run after a partial failure would otherwise die on the modules that
      # DID publish.
      - name: Publish non-engine modules to GitHub Packages
        if: ${{ inputs.githubPackages }}
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${BMC4J_VERSION:-}" ] || { echo "::error::no version provided - refusing to publish the 0.0.1-local dev default; pass the version input"; exit 1; }
          tasks=""
          for mod in bmc-runtime bmc-gradle-plugin bmc-models bmc-kotlin bmc-contracts bmc-constraints bmc-constraints-jakarta; do
            if curl -sf -o /dev/null -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
                "https://maven.pkg.github.com/${{ github.repository }}/org/bmc4j/$mod/$BMC4J_VERSION/$mod-$BMC4J_VERSION.pom"; then
              echo "$mod $BMC4J_VERSION already on GitHub Packages - skipping"
            else
              tasks="$tasks :$mod:publishAllPublicationsToGitHubPackagesRepository"
            fi
          done
          if [ -z "$tasks" ]; then
            echo "every module already published - nothing to do"
          else
            ./gradlew -p core --no-daemon $tasks
          fi

      # Maven Central staging: same module set into a local directory repo (signed -
      # Central requires .asc on every file), handed to the release workflow as an
      # artifact to merge into the Portal bundle alongside the per-platform engine jars.
      - name: Publish to Central staging artifact
        if: ${{ inputs.centralStaging }}
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew -p core --no-daemon
          -PcentralStagingDir="$GITHUB_WORKSPACE/central-staging"
          :bmc-runtime:publishAllPublicationsToCentralStagingRepository
          :bmc-gradle-plugin:publishAllPublicationsToCentralStagingRepository
          :bmc-models:publishAllPublicationsToCentralStagingRepository
          :bmc-kotlin:publishAllPublicationsToCentralStagingRepository
          :bmc-contracts:publishAllPublicationsToCentralStagingRepository
          :bmc-constraints:publishAllPublicationsToCentralStagingRepository
          :bmc-constraints-jakarta:publishAllPublicationsToCentralStagingRepository

      - name: Upload Central staging artifact
        if: ${{ inputs.centralStaging }}
        uses: actions/upload-artifact@v7
        with:
          name: central-staging-core
          path: central-staging/
          if-no-files-found: error
