# Run modules' tasks concurrently. The examples are independent projects and each proof spawns its
# own jbmc, so the suite overlaps instead of running each module's test task back-to-back — roughly halving
# the regression wall-clock. Lower --max-workers if many concurrent jbmc/solver processes strain RAM.
org.gradle.parallel=true

# Reuse up-to-date task outputs across builds (incremental dev re-runs only what changed).
org.gradle.caching=true

# Daemon heap. The bmcMirrorClasspath task runs the classpath rewrite in a classloader-isolated worker
# that lives in THIS daemon JVM, and with org.gradle.parallel several modules' mirror tasks can run at
# once, each holding a few large inflated dependency jars resident. The Gradle default heap is too small
# for that on a cold CI runner (observed: OutOfMemoryError in the worker), so raise it. The mirror walk
# also self-limits its per-task fan-out (bmc.mirrorParallelism) to keep the per-walk peak bounded.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
